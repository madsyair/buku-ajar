# Contoh _quarto.yml buku ajar (B5, PDF bertag lewat LuaLaTeX + Word), diturunkan dari
# seri statistika Bayesian. Tipografi: references/aturan-gaya-dan-tampilan.md.
# Salin ke <proyek>/<buku>/_quarto.yml; ganti JUDUL, PENULIS, N, dan bab.
project:
  type: book
  output-dir: _book
  # Fon rumus Word (m:mathFont) dipasang sesudah render: Pandoc tidak menyalin
  # m:mathPr dari reference-doc (G-DOCX-RUMUS memeriksanya).
  post-render:
    - ../_bersama/huruf.py --pasca-render

book:
  title: "JUDUL BUKU"            # judul saja; TANPA subtitle (keputusan penulis, G-HALJUDUL)
  author: "PENULIS"
  date: "2026-11-07"             # tanggal ISO saja; teks di sini mencetak "Invalid Date"
  date-format: "[Draf revisi ke-1 · ]D MMMM YYYY"   # naikkan N tiap putaran revisi; catat di REVISI.md
  # Bab ditambahkan satu per satu setelah lulus harness (urutan nomor)
  chapters:
    - index.qmd                  # prakata, termasuk "Data yang digunakan dan batasannya"
    - bab01.qmd
    - references.qmd
  # appendices:
  #   - lampiran-a.qmd
  #   - lampiran-c-sumber-data.qmd

lang: id-ID
language:
  crossref-eq-prefix: "persamaan"     # "persamaan" huruf kecil (G-PERSAMAAN); @Eq- di awal kalimat
  crossref-sec-prefix: "Subbab"
  crossref-apx-prefix: "Lampiran"
  section-title-appendices: "Lampiran"
  callout-note-title: "Penurunan"
  callout-tip-title: "Ingat"
  callout-important-title: "Tujuan belajar"

filters:
  - ../_bersama/bahasa-asing.lua      # istilah asing miring -> lang=en (pemenggalan Inggris)
  - ../_bersama/catatan.lua           # ::: {.catatan} di bawah tabel/gambar

bibliography: pustaka.bib
csl: ../_bersama/apa.csl              # penulis-tahun
number-sections: true
crossref:
  chapters: true

execute:
  echo: true
  warning: false
  message: false
  freeze: false

knitr:
  opts_chunk:
    comment: "##"
    collapse: false
    fig.align: center

format:
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any, headings=small]
    pdf-engine: lualatex              # PDF bertag; XeLaTeX tidak mendukung tagging
    template-partials:
      - ../_bersama/doc-class.tex     # \DocumentMetadata sebelum \documentclass
    # Ukuran: kunci "ukuran" (b5, unesco, a5, a4, 6x9, 7x10) dan "profil" (seri,
    # springer, crc, wiley) di harness/konfig.json. Bawaan: B5, 12 pt, kolom
    # prosa 120 mm (40–70 karakter per baris).
    # >>> profil: seri, ukuran b5 (dibangkitkan _bersama/huruf.py)
    # kolom 120.0 mm; mono kode 7.2 pt (72 karakter), keluaran 6.8 pt (78 karakter)
    geometry:
      - paperwidth=176mm
      - paperheight=250mm
      - inner=28mm
      - outer=28mm
      - top=22mm
      - bottom=24mm
    fontsize: 12pt
    linestretch: 1.1
    # <<< profil
    # Huruf: satu kunci "huruf" di harness/konfig.json (libertinus, springer,
    # crc, stix); blok di bawah ditulis ulang oleh _bersama/huruf.py, jangan
    # disunting tangan. Bawaan Libertinus: satu keluarga untuk teks, judul,
    # rumus, kode, gambar, TikZ, dan Word; sansfont sengaja Libertinus Serif.
    # >>> huruf: libertinus (dibangkitkan _bersama/huruf.py dari harness/konfig.json)
    mainfont: Libertinus Serif
    sansfont: Libertinus Serif
    mathfont: Libertinus Math
    monofont: Libertinus Mono
    monofontoptions: [Scale=0.8]
    # <<< huruf
    callout-icon: false               # tanpa ikon FontAwesome: satu keluarga huruf
    code-block-bg: "#F4F6F5"          # dipakai blok lebar kode (preamble.tex)
    code-block-border-left: "#0F3D3E"
    indent: true                      # paragraf menjorok, tanpa spasi antarparagraf (lihat preamble)
    toc: true
    toc-depth: 2
    lof: false
    fig-format: pdf
    fig-width: 4.7                    # lebar kolom B5 120 mm; sesuaikan untuk ukuran lain
    fig-height: 3.2
    fig-pos: "H"                      # gambar dan tabel tidak mengambang
    tbl-pos: "H"
    include-in-header:
      - ../_bersama/preamble.tex      # huruf, blok lebar, tag judul, indentfirst, draf, penggalan
      - ../_bersama/hak-cipta.tex     # \halamanhakcipta (fon dan lisensinya, data "belum ditetapkan")
    include-before-body:              # halaman hak cipta sesudah halaman judul (Word: tulis di index.qmd)
      - text: '\halamanhakcipta{JUDUL BUKU}{PENULIS}{2026}{Draf revisi ke-1}{Quarto, R, Python, \LuaLaTeX}'
    keep-tex: true                    # perlu untuk G-TEPI dan G-PENGGALAN
    latex-clean: false                # perlu untuk G-TEPI dan G-LOG
    # Quarto tidak mengulang LuaLaTeX untuk "Rerun to correct this" (hook
    # lastpage), sehingga daftar isi tertinggal satu putaran (Indeks hilang,
    # nomor halaman salah). Empat putaran: awal, indeks, makeindex, lalu stabil.
    latex-min-runs: 4
  docx:
    callout-icon: false               # ikon kotak di Word adalah gambar kecil (G-DOCX)
    reference-doc: ../_bersama/reference-b5.docx   # huruf.py: springer atau docx_huruf "windows" -> reference-b5-windows.docx
    toc: true
    toc-depth: 2
    fig-format: png
    fig-dpi: 300
    fig-width: 5.2
    fig-height: 3.2
